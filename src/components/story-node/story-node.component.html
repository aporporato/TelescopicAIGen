@if (node.children.length === 0 || node.isCollapsed) {
  @if (node.expandable) {
    <span 
      class="word-span trigger"
      [class.loading]="node.isLoading"
      [attr.role]="'button'"
      [attr.tabindex]="0"
      [attr.aria-expanded]="node.children.length > 0 && !node.isCollapsed"
      [attr.aria-busy]="node.isLoading"
      [attr.aria-label]="'Expand trigger: ' + node.content"
      (click)="onExpandClick()"
      (keydown)="onKeydown($event)">{{ node.content }}</span>
  } @else {
    <span class="word-span plain">{{ node.content }}</span>
  }
} @else {
  <span 
    class="expanded-container" 
    [attr.aria-expanded]="true"
    (dblclick)="onDblClick($event)">
    @for (child of node.children; track child.id; let last = $last) {
      <app-story-node 
        [node]="child" 
        (expand)="expand.emit($event)"
        (collapse)="collapse.emit($event)">
      </app-story-node>@if (!last) {{{ ' ' }}}
    }
  </span>
}
