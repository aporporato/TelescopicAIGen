<div class="min-h-screen bg-gray-50 flex flex-col items-center p-4 sm:p-6 lg:p-8">
  <div class="w-full max-w-4xl mx-auto">
    
    <header class="text-center mb-8">
      <h1 class="text-4xl sm:text-5xl font-bold text-slate-800 tracking-tight">
        AI Telescopic Text
      </h1>
      <p class="mt-3 text-lg text-slate-600 max-w-2xl mx-auto">
        Start with a prompt. Click the <span class="text-indigo-600 font-semibold">highlighted</span> words to expand the story.
      </p>
    </header>

    <main class="bg-white rounded-xl shadow-lg p-6 sm:p-8">
      <div class="flex flex-col sm:flex-row gap-4">
        <input 
          type="text" 
          [ngModel]="prompt()" 
          (ngModelChange)="prompt.set($event)"
          (keyup.enter)="generateInitialStory()"
          placeholder="Enter a story prompt..."
          class="flex-grow p-3 border border-slate-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out text-lg"
          [disabled]="isLoading()"
        />
        <button 
          (click)="generateInitialStory()" 
          [disabled]="isLoading() || !prompt().trim()"
          class="px-8 py-3 bg-indigo-600 text-white font-semibold rounded-md shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-indigo-300 disabled:cursor-not-allowed transition-colors duration-200 text-lg">
          @if (isLoading()) {
            <span class="flex items-center justify-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Generating...
            </span>
          } @else {
            <span>Generate</span>
          }
        </button>
      </div>

      @if (error()) {
        <div class="mt-6 p-4 bg-red-100 border border-red-300 text-red-800 rounded-md">
          <p>{{ error() }}</p>
        </div>
      }

      <div class="mt-8 text-2xl leading-relaxed text-slate-700 p-4 min-h-[10rem] border-t border-slate-200">
        @if (story().length > 0) {
          <p class="whitespace-pre-wrap">
            @for (node of story(); track node.id) {
              <app-story-node [node]="node" (expand)="handleExpand($event)"></app-story-node>
            }
          </p>
        } @else if (!isLoading()) {
          <p class="text-slate-400 text-center text-xl pt-8">Your story will appear here...</p>
        }
      </div>
    </main>
    
    <footer class="text-center mt-8 text-slate-500">
      <p>Powered by Angular and Google Gemini</p>
    </footer>
  </div>
</div>
